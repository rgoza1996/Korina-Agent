<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1080" viewBox="0 0 320 1080" role="img" aria-labelledby="title desc">
<title id="title">Korina API at a glance, phone layout</title><desc id="desc">Selected current API routes, not a complete inventory. Korina serves health, readiness, models, settings, transcription, chat and optional agent reporting. Speech routes belong to a separate Kokoro-compatible service. The running instance exposes the full schema at /docs and /openapi.json.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3a5a7a"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.code{font-family:ui-monospace,"DejaVu Sans Mono",monospace}</style>
<rect width="320" height="1080" fill="#f4efe6"/>
<text x="24" y="37" font-size="25" font-weight="700" text-anchor="start" fill="#2b2620">API at a glance</text>
<text x="24" y="65" font-size="17" font-weight="400" text-anchor="start" fill="#5a4f44">Selected current routes</text>
<rect x="24" y="88" width="272" height="135" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="118" font-size="20" font-weight="700" text-anchor="start" fill="#3a5a7a">Status + readiness</text>
<text x="40" y="150" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">GET /api/health</text>
<text x="40" y="175" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">GET /api/ready</text>
<text x="40" y="204" font-size="16" font-weight="400" text-anchor="start" fill="#5a4f44">Selected stack readiness.</text>
<rect x="24" y="239" width="272" height="135" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="269" font-size="20" font-weight="700" text-anchor="start" fill="#3a5a7a">Models + settings</text>
<text x="40" y="301" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">GET /api/models</text>
<text x="40" y="326" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">GET · POST /api/config</text>
<text x="40" y="355" font-size="16" font-weight="400" text-anchor="start" fill="#5a4f44">Providers and saved settings.</text>
<rect x="24" y="390" width="272" height="135" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="420" font-size="20" font-weight="700" text-anchor="start" fill="#3a5a7a">Transcription</text>
<text x="40" y="452" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">POST /api/transcribe</text>
<text x="40" y="506" font-size="16" font-weight="400" text-anchor="start" fill="#5a4f44">Full · partial · streamed.</text>
<rect x="24" y="541" width="272" height="135" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="571" font-size="20" font-weight="700" text-anchor="start" fill="#3a5a7a">Response</text>
<text x="40" y="603" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">POST /api/chat</text>
<text x="40" y="657" font-size="16" font-weight="400" text-anchor="start" fill="#5a4f44">History + current message.</text>
<rect x="24" y="692" width="272" height="135" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="722" font-size="20" font-weight="700" text-anchor="start" fill="#3a5a7a">Speech service</text>
<text x="40" y="754" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">POST /stream/speech</text>
<text x="40" y="779" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">POST /v1/audio/speech</text>
<text x="40" y="808" font-size="16" font-weight="400" text-anchor="start" fill="#5a4f44">Separate speech service.</text>
<rect x="24" y="843" width="272" height="135" rx="12" fill="#f0eaf4" stroke="#b29bbf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="40" y="873" font-size="20" font-weight="700" text-anchor="start" fill="#6a4f7a">Optional agent</text>
<text x="40" y="905" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">POST /api/agent/transcript</text>
<text x="40" y="930" font-size="16" font-weight="400" text-anchor="start" fill="#2b2620" class="code">GET /api/agent/events</text>
<text x="40" y="959" font-size="16" font-weight="400" text-anchor="start" fill="#5a4f44">Reports / permissions.</text>
<text x="24" y="1038" font-size="18" font-weight="700" text-anchor="start" fill="#3a5a7a">Full schema: /docs</text>
<text x="24" y="1064" font-size="16" font-weight="400" text-anchor="start" fill="#5a4f44">No built-in tool execution.</text>
</svg>
