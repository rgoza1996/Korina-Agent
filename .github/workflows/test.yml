name: tests

on:
  push:
    branches: [beta, alpha, master, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg for real decode-bound regression
        if: matrix.python-version == '3.12'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run pytest
        run: python -m pytest --cov=korina --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  minimum-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install FFmpeg and declared dependency floors
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e '.[test]' -c tests/constraints/minimum.txt
          python -m pip check
      - name: Run minimum-dependency tests
        run: python -m pytest -q --junitxml=minimum-dependencies.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-dependencies
          path: minimum-dependencies.xml

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check korina tests scripts build_support.py kokoro-streaming-server.py
      - run: mypy --ignore-missing-imports korina
      - run: python -m build
      - name: Verify installed UI assets
        run: |
          python -m venv /tmp/korina-wheel
          /tmp/korina-wheel/bin/pip install dist/*.whl
          checkout="$PWD"
          cd /tmp
          /tmp/korina-wheel/bin/python "$checkout/scripts/check_installed.py" --source-assets "$checkout/Korina"

  speech-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Whisper runtime (no model weights)
        run: python -m pip install -e '.[test,whisper]'
      - name: Exercise real decoder compatibility
        run: |
          python -c "import faster_whisper.audio"
          python -m pytest -q tests/runtime/test_whisper_dependencies.py

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[test]'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
