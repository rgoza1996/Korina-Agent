name: Live voice-stack smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Korina URL visible to the self-hosted runner
        required: true
        default: http://127.0.0.1:8001

permissions:
  contents: read

jobs:
  readiness:
    runs-on: [self-hosted, korina-demo]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check live demo readiness (read-only)
        env:
          KORINA_SMOKE_BASE: ${{ inputs.base_url }}
        run: python3 scripts/check_stack.py --base "$KORINA_SMOKE_BASE" > readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-readiness
          path: readiness.json
