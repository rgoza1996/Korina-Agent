[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "korina-agent"
version = "0.1.0.dev0"
description = "Korina Voice Lab backend and browser UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.18,<1",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "anyio>=4.4,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "pytest-cov>=5,<8",
]
dev = ["korina-agent[test]", "ruff>=0.14,<1", "build>=1,<2", "mypy>=1.14,<2"]
# faster-whisper 1.2.1 passes metadata_errors, removed by PyAV 19.
# https://github.com/SYSTRAN/faster-whisper/issues/1589
whisper = ["faster-whisper>=1.1,<2", "av>=11,<19"]
tts = ["kokoro>=0.9,<1", "torch>=2.4,<3"]

[project.scripts]
korina = "korina.app:main"
korina-tts = "korina.tts.server:main"

[tool.setuptools.packages.find]
include = ["korina*"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E9", "F"]
