<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1072" viewBox="0 0 320 1072" role="img" aria-labelledby="title desc">
<title id="title">Korina voice and context flow, phone layout</title><desc id="desc">Focused demo flow: browser microphone and VAD, local Whisper transcription, current-session history plus the question, Meta Model API response, then local Kokoro and native browser playback. Optional agent reporting is a separate path sharing runtime state. No durable memory or built-in tool execution is shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3a5a7a"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.code{font-family:ui-monospace,"DejaVu Sans Mono",monospace}</style>
<rect width="320" height="1072" fill="#f4efe6"/>
<text x="24" y="37" font-size="25" font-weight="700" text-anchor="start" fill="#2b2620">A voice turn</text>
<text x="24" y="65" font-size="17" font-weight="400" text-anchor="start" fill="#5a4f44">Whisper → Meta → Kokoro</text>
<rect x="24" y="88" width="272" height="110" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="115" font-size="16" font-weight="700" text-anchor="start" fill="#3a5a7a">1 · BROWSER</text>
<text x="40" y="145" font-size="22" font-weight="700" text-anchor="start" fill="#2b2620">Capture</text>
<text x="40" y="175" font-size="16.5" font-weight="400" text-anchor="start" fill="#5a4f44">Browser mic + VAD</text>
<path d="M160 201V217" fill="none" stroke="#3a5a7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="222" width="272" height="110" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="249" font-size="16" font-weight="700" text-anchor="start" fill="#3a5a7a">2 · LOCAL</text>
<text x="40" y="279" font-size="22" font-weight="700" text-anchor="start" fill="#2b2620">Whisper</text>
<text x="40" y="309" font-size="16.5" font-weight="400" text-anchor="start" fill="#5a4f44">Local audio → transcript</text>
<path d="M160 335V351" fill="none" stroke="#3a5a7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="356" width="272" height="110" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="383" font-size="16" font-weight="700" text-anchor="start" fill="#3a5a7a">3 · THIS SESSION</text>
<text x="40" y="413" font-size="22" font-weight="700" text-anchor="start" fill="#2b2620">Context</text>
<text x="40" y="443" font-size="16.5" font-weight="400" text-anchor="start" fill="#5a4f44">Earlier turns + question</text>
<path d="M160 469V485" fill="none" stroke="#3a5a7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="490" width="272" height="110" rx="12" fill="#e7eef5" stroke="#3a5a7a" stroke-width="1.5"/>
<text x="40" y="517" font-size="16" font-weight="700" text-anchor="start" fill="#3a5a7a">4 · REMOTE</text>
<text x="40" y="547" font-size="22" font-weight="700" text-anchor="start" fill="#2b2620">Meta Model API</text>
<text x="40" y="577" font-size="16.5" font-weight="400" text-anchor="start" fill="#5a4f44">Context → text answer</text>
<path d="M160 603V619" fill="none" stroke="#3a5a7a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="624" width="272" height="110" rx="12" fill="#fffaf1" stroke="#cdc1ad" stroke-width="1.5"/>
<text x="40" y="651" font-size="16" font-weight="700" text-anchor="start" fill="#3a5a7a">5 · LOCAL</text>
<text x="40" y="681" font-size="22" font-weight="700" text-anchor="start" fill="#2b2620">Kokoro</text>
<text x="40" y="711" font-size="16.5" font-weight="400" text-anchor="start" fill="#5a4f44">Local speech → playback</text>
<rect x="24" y="784" width="272" height="242" rx="12" fill="#f0eaf4" stroke="#b29bbf" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="40" y="817" font-size="21" font-weight="700" text-anchor="start" fill="#6a4f7a">Optional agent</text>
<text x="40" y="850" font-size="17" font-weight="400" text-anchor="start" fill="#2b2620">Conversation transcript</text>
<text x="40" y="877" font-size="17" font-weight="400" text-anchor="start" fill="#2b2620">↓  Agent model / worker</text>
<text x="40" y="904" font-size="17" font-weight="400" text-anchor="start" fill="#2b2620">↓  Reports / permissions</text>
<text x="40" y="943" font-size="17" font-weight="400" text-anchor="start" fill="#5a4f44">Shared runtime state.</text>
<text x="40" y="970" font-size="16.5" font-weight="400" text-anchor="start" fill="#5a4f44">No built-in tool execution.</text>
<text x="40" y="1004" font-size="17" font-weight="400" text-anchor="start" fill="#5a4f44">Not durable memory.</text>
<text x="24" y="1053" font-size="16" font-weight="400" text-anchor="start" fill="#3a5a7a">Earlier turns + the current question.</text>
</svg>
